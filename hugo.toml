# Paper Lanterns website. Content comes from the Paper Lanterns pipeline via scripts/sync_from_pipeline.py;
# this repository holds design only (DECISIONS.md D4).
baseURL = "https://paperlanterns.ink/"
languageCode = "en"
title = "Paper Lanterns"
disableKinds = ["taxonomy", "term"]
enableRobotsTXT = true

[module.hugoVersion]
  min = "0.139.3"

[markup.goldmark.renderer]
  # Templates escape every run of letter text; nothing needs raw HTML (D6).
  unsafe = false

[markup.goldmark.parser.attribute]
  # Lets imported essays mark verse paragraphs with {.poem} (D15).
  block = true

# The old site's addresses, kept exactly (D15): /letter/<file>/, /essay/<file>/ and so on.
[permalinks.page]
  letters = "/letter/:filename/"
  essays = "/essay/:filename/"
  lectures = "/lecture/:filename/"
  speeches = "/speech/:filename/"
  garden = "/garden/:filename/"
  journal = "/journal/:slug/"
  sets = "/collection/:filename/"

[mediaTypes."text/cfheaders"]
  delimiter = ""

[outputFormats.headers]
  mediaType = "text/cfheaders"
  baseName = "_headers"
  isPlainText = true
  notAlternative = true

# The old site's feed and JSON endpoints keep their addresses (D16).
[outputFormats.RSS]
  baseName = "rss"

[outputFormats.searchdata]
  mediaType = "application/json"
  baseName = "search-data"
  isPlainText = true
  notAlternative = true

[outputFormats.randomcontent]
  mediaType = "application/json"
  path = "api"
  baseName = "random-content"
  isPlainText = true
  notAlternative = true

# Share cards (D31): Hugo writes card.html beside the home page, each book and each letter; scripts/og_cards.mjs
# draws each one as card.png in headless Chromium and deletes the card.html, so none is ever published.
[outputFormats.ogcard]
  mediaType = "text/html"
  baseName = "card"
  isHTML = true
  notAlternative = true

[outputs]
  home = ["HTML", "headers", "RSS", "searchdata", "randomcontent", "ogcard"]
  section = ["HTML"]
  page = ["HTML"]

[[cascade]]
  outputs = ["HTML", "ogcard"]
  [cascade._target]
    kind = "section"
    path = "/collections/*"

[[cascade]]
  outputs = ["HTML", "ogcard"]
  [cascade._target]
    kind = "page"
    path = "/collections/**"

# The journal (D32): each post gets a share card, and the journal has its own feed at /journal/rss.xml.
[[cascade]]
  outputs = ["HTML", "RSS"]
  [cascade._target]
    kind = "section"
    path = "/journal"

[[cascade]]
  outputs = ["HTML", "ogcard"]
  [cascade._target]
    kind = "page"
    path = "/journal/**"

[params]
  description = "Whole collections of public-domain letters, read from the printed page and set beside the scan they came from."
  scanWidth = 600
  scanWidth2x = 1200

[params.security]
  # 'wasm-unsafe-eval' is the one allowance beyond 'self': Pagefind search runs a WebAssembly module (D17).
  # One owner for the policy: layouts/index.headers writes it into Cloudflare's _headers file and
  # scripts/check_site.py fails the build if the dev-server copy below drifts from it.
  csp = "default-src 'none'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self'; img-src 'self' https://archive.org https://*.archive.org; font-src 'self'; connect-src 'self'; manifest-src 'self'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'"

[[server.headers]]
  for = "/**"
  [server.headers.values]
    Content-Security-Policy = "default-src 'none'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self'; img-src 'self' https://archive.org https://*.archive.org; font-src 'self'; connect-src 'self'; manifest-src 'self'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
