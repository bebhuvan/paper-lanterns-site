{{- /* The book's lanterns. Args: lanterns (from book-traits), class, label (empty for decorative use). */ -}}
<svg class="{{ .class }}" viewBox="0 0 200 90"{{ with .label }} role="img" aria-label="{{ . }}"{{ else }} aria-hidden="true"{{ end }}>
<path class="string" d="M-4 10 Q100 30 204 10"/>
{{- range .lanterns }}
<line class="drop" x1="{{ .x }}" y1="{{ .y }}" x2="{{ .x }}" y2="{{ add .y .drop }}"/>
<circle class="{{ if .lit }}lit{{ else }}bulb{{ end }}" cx="{{ .x }}" cy="{{ add (add .y .drop) 3.4 }}" r="{{ if .lit }}3.6{{ else }}2.6{{ end }}"><title>{{ .decade }}s: {{ .n }} {{ cond (eq (int .n) 1) "letter" "letters" }}</title></circle>
{{- end }}
</svg>
{{- /**/ -}}
