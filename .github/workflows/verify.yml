name: verify

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          fetch-depth: 0 # gitleaks scans the whole history

      - name: Install the pinned Hugo (checksum verified)
        env:
          HUGO_SHA256: 16db2268faf7551d83a1765d1071953f3f6d2da54b4247a8944d6f311d88c3ad
        run: |
          set -euo pipefail
          v="$(cat .hugo-version)"
          f="hugo_extended_${v}_linux-amd64.tar.gz"
          curl -fsSL -o "$RUNNER_TEMP/$f" "https://github.com/gohugoio/hugo/releases/download/v${v}/${f}"
          echo "${HUGO_SHA256}  $RUNNER_TEMP/$f" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/hugo" && tar -xzf "$RUNNER_TEMP/$f" -C "$RUNNER_TEMP/hugo" hugo
          echo "HUGO=$RUNNER_TEMP/hugo/hugo" >> "$GITHUB_ENV"

      - name: Install the pinned gitleaks (checksum verified)
        env:
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          set -euo pipefail
          v="$(cat .gitleaks-version)"
          f="gitleaks_${v}_linux_x64.tar.gz"
          curl -fsSL -o "$RUNNER_TEMP/$f" "https://github.com/gitleaks/gitleaks/releases/download/v${v}/${f}"
          echo "${GITLEAKS_SHA256}  $RUNNER_TEMP/$f" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/gitleaks" && tar -xzf "$RUNNER_TEMP/$f" -C "$RUNNER_TEMP/gitleaks" gitleaks
          echo "$RUNNER_TEMP/gitleaks" >> "$GITHUB_PATH"

      - name: Install the pinned Pagefind (checksum verified)
        env:
          PAGEFIND_SHA256: 004d40c9a644c995dadc42b8031196c6f17e7a6dacf9a6c15c63286dd6ead5f2
        run: |
          set -euo pipefail
          v="$(cat .pagefind-version)"
          f="pagefind-v${v}-x86_64-unknown-linux-musl.tar.gz"
          curl -fsSL -o "$RUNNER_TEMP/$f" "https://github.com/CloudCannon/pagefind/releases/download/v${v}/${f}"
          echo "${PAGEFIND_SHA256}  $RUNNER_TEMP/$f" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/pagefind" && tar -xzf "$RUNNER_TEMP/$f" -C "$RUNNER_TEMP/pagefind" pagefind
          echo "$RUNNER_TEMP/pagefind" >> "$GITHUB_PATH"

      # Share cards already drawn by an earlier run are reused; only cards whose page changed are drawn again (D31).
      - name: Restore drawn share cards
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .cache/og
          key: og-cards-${{ github.sha }}
          restore-keys: og-cards-

      # Ubuntu runners ship Google Chrome for the phone-width check. The pipeline repository is not checked out here, so ./verify skips the drift check and the pipeline's tests.
      - name: Verify
        env:
          CHROME: /usr/bin/google-chrome
        run: ./verify --skip-pipeline
